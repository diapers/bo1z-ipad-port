[package]
name = "bo1z_host"
version = "0.1.0"
edition = "2021"
description = "Native host for the BO1Z WebAssembly build: wasmtime + ANGLE/GLES3 + native audio and controller input."

[[bin]]
name = "bo1z_host"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "threads", "parallel-compilation", "std", "addr2line", "demangle", "gc", "gc-drc", "anyhow"] }
anyhow = "1"
serde_json = "1"
parking_lot = "0.12"
winit = "0.30"
raw-window-handle = "0.6"
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
gl = "0.14"
cpal = "0.15"

[target.'cfg(not(target_os = "ios"))'.dependencies]
gilrs = "0.11"
image-webp = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-game-controller = "0.3"
objc2-quartz-core = "0.3"
objc2-ui-kit = "0.3"

[profile.release]
opt-level = 3
debug = 1
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
